name: Build JSKeyboard IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: 'false'

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Environment Info
        run: |
          echo "=== System Info ==="
          xcode-select -p
          xcodebuild -version
          swift --version 2>/dev/null || echo "swift not available"
          echo ""
          echo "=== Project Structure ==="
          find JSKeyboard.xcodeproj -type f | sort
          echo ""
          echo "=== XCScheme ==="
          ls -la JSKeyboard.xcodeproj/xcshareddata/xcschemes/
          echo ""
          cat JSKeyboard.xcodeproj/xcshareddata/xcschemes/JSKeyboard.xcscheme
      
      - name: List Schemes
        id: list_schemes
        run: |
          echo "=== Available Schemes ==="
          xcodebuild -list -project JSKeyboard.xcodeproj 2>&1 || echo "Failed to list schemes"
      
      - name: Build
        id: build
        run: |
          set -e
          rm -rf build
          mkdir -p build
          
          echo "=== Building ==="
          xcodebuild build \
            -project JSKeyboard.xcodeproj \
            -scheme JSKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            2>&1 | tee build/build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"
          
          echo ""
          echo "=== Finding built products ==="
          APP=$(find build -name "JSKeyboard.app" -type d 2>/dev/null | head -1)
          EXT=$(find build -name "JSKeyboardExtension.appex" -type d 2>/dev/null | head -1)
          
          # Also check DerivedData
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "JSKeyboard.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$EXT" ]; then
            EXT=$(find ~/Library/Developer/Xcode/DerivedData -name "JSKeyboardExtension.appex" -type d 2>/dev/null | head -1)
          fi
          
          echo "App: ${APP:-not found}"
          echo "Ext: ${EXT:-not found}"
          
          if [ -n "$APP" ]; then
            echo "app_path=$APP" >> $GITHUB_OUTPUT
            echo "✅ App found"
          else
            echo "❌ App not found"
            echo "=== Build Log (last 50 lines) ==="
            tail -50 build/build.log
            echo "app_path=" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          if [ -n "$EXT" ]; then
            echo "ext_path=$EXT" >> $GITHUB_OUTPUT
            echo "✅ Extension found"
          else
            echo "ext_path=" >> $GITHUB_OUTPUT
            echo "⚠️ Extension not found"
          fi
      
      - name: Package IPA
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP="${{ steps.build.outputs.app_path }}"
          EXT="${{ steps.build.outputs.ext_path }}"
          
          echo "=== Packaging IPA ==="
          PAYLOAD="build/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/"
          
          if [ -n "$EXT" ]; then
            EXT_NAME=$(basename "$EXT")
            APP_NAME=$(basename "$APP" .app)
            mkdir -p "$PAYLOAD/$APP_NAME/PlugIns/$EXT_NAME"
            cp -R "$EXT" "$PAYLOAD/$APP_NAME/PlugIns/$EXT_NAME/"
            echo "✅ Extension embedded"
          fi
          
          cd build
          zip -r ../JSKeyboard.ipa Payload -x "*.DS_Store"
          cd ..
          
          echo "✅ IPA created: $(du -sh JSKeyboard.ipa | cut -f1)"
          ls -la JSKeyboard.ipa
      
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyboard
          path: JSKeyboard.ipa
          retention-days: 14
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          retention-days: 7
      
      - name: Summary
        if: always()
        run: |
          echo "## 📱 JSKeyboard Build" >> $GITHUB_STEP_SUMMARY
          if [ -f "JSKeyboard.ipa" ]; then
            echo "✅ **IPA 构建成功！**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **构建失败**" >> $GITHUB_STEP_SUMMARY
          fi
