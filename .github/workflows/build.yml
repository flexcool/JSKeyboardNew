name: Build JSKeyboard IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          echo "=== Check project ==="
          ls -la JSKeyboard.xcodeproj/
          echo "=== Check workspace ==="
          ls -la JSKeyboard.xcworkspace/ 2>/dev/null || echo "no workspace"
      
      - name: Build with xcodebuild (using project)
        id: build
        run: |
          set -e
          rm -rf build
          mkdir -p build
          
          # 使用 project（scheme 在 project 中）
          PROJECT_ARG="-project JSKeyboard.xcodeproj" 
          
          echo "=== Building with: $PROJECT_ARG ==="
          xcodebuild build \
            $PROJECT_ARG \
            -scheme JSKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            2>&1 | tee build/build.log
          
          echo ""
          echo "=== Finding .app ==="
          APP=$(find build -name "JSKeyboard.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "Looking in derived data..."
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "JSKeyboard.app" -type d 2>/dev/null | head -1)
          fi
          
          if [ -n "$APP" ]; then
            echo "app_path=$APP" >> $GITHUB_OUTPUT
            echo "✅ App found: $APP"
            ls -la "$APP"
          else
            echo "❌ App not found in build or DerivedData"
            echo "Build log tail:"
            tail -30 build/build.log
            echo "app_path=" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Package IPA
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP="${{ steps.build.outputs.app_path }}"
          echo "Packaging: $APP"
          
          PAYLOAD="build/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/"
          
          cd build
          zip -r ../JSKeyboard.ipa Payload -x "*.DS_Store"
          cd ..
          
          echo "✅ IPA created: $(du -sh JSKeyboard.ipa | cut -f1)"
          ls -la JSKeyboard.ipa
      
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyboard
          path: JSKeyboard.ipa
          retention-days: 14
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          retention-days: 7
      
      - name: Summary
        if: always()
        run: |
          echo "## 📱 JSKeyboard Build" >> $GITHUB_STEP_SUMMARY
          if [ -f "JSKeyboard.ipa" ]; then
            echo "✅ **IPA 构建成功！**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **构建失败**" >> $GITHUB_STEP_SUMMARY
          fi
