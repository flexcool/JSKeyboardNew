name: Build JSKeyboard IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          echo "=== Listing schemes ==="
          xcodebuild -project JSKeyboard.xcodeproj -list 2>&1 || true
      
      - name: Build and Archive
        run: |
          set -e
          rm -rf build
          mkdir -p build
          
          echo "=== Building and Archiving ==="
          xcodebuild archive \
            -project JSKeyboard.xcodeproj \
            -scheme JSKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/JSKeyboard.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            2>&1 | tee build/archive.log
          
          echo "=== Archive output ==="
          ls -la build/
          ls -la build/JSKeyboard.xcarchive/ 2>/dev/null || true
          ls -la build/JSKeyboard.xcarchive/Products/ 2>/dev/null || true
          
          # 验证 archive 存在
          if [ ! -d "build/JSKeyboard.xcarchive" ]; then
            echo "❌ Archive 创建失败"
            exit 1
          fi
          echo "✅ Archive 创建成功"
      
      - name: Export IPA (manual packaging)
        run: |
          set -e
          echo "=== Packaging IPA manually ==="
          
          # 从 archive 中提取 .app
          ARCHIVE="build/JSKeyboard.xcarchive"
          APP="$ARCHIVE/Products/Applications/JSKeyboard.app"
          
          if [ ! -d "$APP" ]; then
            echo "❌ 未找到 JSKeyboard.app"
            find "$ARCHIVE" -name "*.app" 2>/dev/null
            exit 1
          fi
          
          echo "✅ 找到 App: $APP"
          
          # 创建 Payload
          PAYLOAD="build/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/"
          
          # 打包 IPA
          cd build
          zip -r ../JSKeyboard.ipa Payload -x "*.DS_Store"
          cd ..
          
          echo "✅ IPA 生成完成"
          ls -la JSKeyboard.ipa
          du -sh JSKeyboard.ipa
      
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyboard
          path: JSKeyboard.ipa
          retention-days: 14
      
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          retention-days: 7
      
      - name: Summary
        if: always()
        run: |
          echo "## 📱 JSKeyboard Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "JSKeyboard.ipa" ]; then
            SIZE=$(du -sh JSKeyboard.ipa | cut -f1)
            echo "✅ **IPA 构建成功！**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| 文件名 | JSKeyboard.ipa |" >> $GITHUB_STEP_SUMmary
            echo "| 大小 | $SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| 下载 | [点击此处](https://github.com/flexcool/JSKeyboardNew/actions/artifacts) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **构建失败**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "请查看 [Run #${{ github.run_number }}](https://github.com/flexcool/JSKeyboardNew/actions/runs/${{ github.run_number }}) 获取详细信息" >> $GITHUB_STEP_SUMMARY
          fi
