name: Build JSKeyboard IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build Main App
        id: build_app
        run: |
          set -e
          rm -rf build
          mkdir -p build
          
          echo "=== Building Main App ==="
          xcodebuild build \
            -project JSKeyboard.xcodeproj \
            -scheme JSKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            2>&1 | tee build/app.log
          
          APP=$(find build -name "JSKeyboard.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "JSKeyboard.app" -type d 2>/dev/null | head -1)
          fi
          
          if [ -n "$APP" ]; then
            echo "app_path=$APP" >> $GITHUB_OUTPUT
            echo "✅ Main app built: $APP"
          else
            echo "❌ Main app not found"
            tail -20 build/app.log
            echo "app_path=" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Build Extension
        id: build_ext
        run: |
          set -e
          echo "=== Building Extension ==="
          xcodebuild build \
            -project JSKeyboard.xcodeproj \
            -scheme JSKeyboard \
            -target JSKeyboardExtension \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app.keyboard \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            2>&1 | tee build/ext.log
          
          EXT=$(find build -name "JSKeyboardExtension.appex" -type d 2>/dev/null | head -1)
          if [ -z "$EXT" ]; then
            EXT=$(find ~/Library/Developer/Xcode/DerivedData -name "JSKeyboardExtension.appex" -type d 2>/dev/null | head -1)
          fi
          
          if [ -n "$EXT" ]; then
            echo "ext_path=$EXT" >> $GITHUB_OUTPUT
            echo "✅ Extension built: $EXT"
          else
            echo "❌ Extension not found"
            tail -20 build/ext.log
            echo "ext_path=" >> $GITHUB_OUTPUT
          fi
      
      - name: Package IPA
        if: steps.build_app.outcome == 'success'
        run: |
          set -e
          APP="${{ steps.build_app.outputs.app_path }}"
          EXT="${{ steps.build_ext.outputs.ext_path }}"
          
          echo "=== Packaging IPA ==="
          echo "App: $APP"
          echo "Ext: ${EXT:-none}"
          
          PAYLOAD="build/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/"
          
          # 复制 extension 到 app 内部（如果需要）
          if [ -n "$EXT" ]; then
            EXT_NAME=$(basename "$EXT")
            APP_NAME=$(basename "$APP" .app)
            mkdir -p "$PAYLOAD/$APP_NAME/PlugIns/$EXT_NAME"
            cp -R "$EXT" "$PAYLOAD/$APP_NAME/PlugIns/$EXT_NAME/"
            echo "✅ Extension embedded"
          fi
          
          cd build
          zip -r ../JSKeyboard.ipa Payload -x "*.DS_Store"
          cd ..
          
          echo "✅ IPA created: $(du -sh JSKeyboard.ipa | cut -f1)"
          ls -la JSKeyboard.ipa
      
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyboard
          path: JSKeyboard.ipa
          retention-days: 14
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          retention-days: 7
      
      - name: Summary
        if: always()
        run: |
          echo "## 📱 JSKeyboard Build" >> $GITHUB_STEP_SUMMARY
          if [ -f "JSKeyboard.ipa" ]; then
            echo "✅ **IPA 构建成功！**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **构建失败**" >> $GITHUB_STEP_SUMMARY
          fi
