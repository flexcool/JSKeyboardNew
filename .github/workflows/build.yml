name: Build JSKeyboard IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          echo "=== Available schemes ==="
          xcodebuild -project JSKeyboard.xcodeproj -list 2>&1 || true
      
      - name: Build Main App
        run: |
          set -e
          echo "=== Building JSKeyboard app ==="
          xcodebuild build \
            -project JSKeyboard.xcodeproj \
            -target JSKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            2>&1 | tail -30
          echo "✅ Main app build complete"
          find build -name "*.app" -o -name "*.dSYM" 2>/dev/null | head -5
          ls -la build/ 2>/dev/null || true
      
      - name: Build Keyboard Extension
        run: |
          set -e
          echo "=== Building JSKeyboardExtension ==="
          xcodebuild build \
            -project JSKeyboard.xcodeproj \
            -target JSKeyboardExtension \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app.keyboard \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            2>&1 | tail -30
          echo "✅ Extension build complete"
          find build -name "*.appex" -o -name "*.dSYM" 2>/dev/null | head -5
          ls -la build/ 2>/dev/null || true
      
      - name: Package IPA
        run: |
          set -e
          echo "=== Packaging IPA ==="
          
          # 查找编译产物
          APP_PATH=$(find build -name "JSKeyboard.app" -type d 2>/dev/null | head -1)
          EXT_PATH=$(find build -name "JSKeyboardExtension.appex" -type d 2>/dev/null | head -1)
          
          echo "App path: $APP_PATH"
          echo "Extension path: $EXT_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 JSKeyboard.app"
            exit 1
          fi
          
          # 创建 Payload 目录
          PAYLOAD_DIR="build/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          
          # 复制 .app
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          
          # 复制 extension（如果存在）
          if [ -n "$EXT_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH" .app)
            mkdir -p "$PAYLOAD_DIR/$APP_NAME/PlugIns"
            cp -R "$EXT_PATH" "$PAYLOAD_DIR/$APP_NAME/PlugIns/"
            echo "✅ Extension 已嵌入 App"
          fi
          
          # 打包 IPA
          cd build
          zip -r ../JSKeyboard.ipa Payload -x "*.DS_Store" 2>/dev/null
          cd ..
          
          echo "✅ IPA 生成完成"
          ls -la JSKeyboard.ipa
          du -sh JSKeyboard.ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyboard
          path: JSKeyboard.ipa
          retention-days: 14
      
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          retention-days: 7
