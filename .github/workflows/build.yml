name: Build JSKeyboard IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -project JSKeyboard.xcodeproj -list 2>&1 || true
      
      - name: Clean Build
        run: |
          rm -rf build
          mkdir -p build
      
      - name: Build Main App
        id: build_main
        run: |
          set -e
          echo "=== Building JSKeyboard ==="
          BUILD_OUTPUT=$(xcodebuild build \
            -project JSKeyboard.xcodeproj \
            -target JSKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            BUILD_ROOT="$(pwd)/build" \
            SYMROOT="$(pwd)/build" \
            OBJROOT="$(pwd)/build" \
            2>&1)
          
          echo "$BUILD_OUTPUT" | tail -20
          echo "$BUILD_OUTPUT" > build/main_build.log
          
          # 查找 .app
          APP=$(find build -name "JSKeyboard.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "app_path=$APP" >> $GITHUB_OUTPUT
            echo "✅ Main app built: $APP"
          else
            echo "❌ Main app not found"
            ls -la build/
            exit 1
          fi
      
      - name: Build Keyboard Extension
        id: build_ext
        run: |
          set -e
          echo "=== Building JSKeyboardExtension ==="
          BUILD_OUTPUT=$(xcodebuild build \
            -project JSKeyboard.xcodeproj \
            -target JSKeyboardExtension \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app.keyboard \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            BUILD_ROOT="$(pwd)/build" \
            SYMROOT="$(pwd)/build" \
            OBJROOT="$(pwd)/build" \
            2>&1)
          
          echo "$BUILD_OUTPUT" | tail -20
          echo "$BUILD_OUTPUT" > build/ext_build.log
          
          EXT=$(find build -name "JSKeyboardExtension.appex" -type d 2>/dev/null | head -1)
          if [ -n "$EXT" ]; then
            echo "ext_path=$EXT" >> $GITHUB_OUTPUT
            echo "✅ Extension built: $EXT"
          else
            echo "⚠️ Extension not found (may be embedded)"
          fi
      
      - name: Package IPA
        id: package
        run: |
          set -e
          echo "=== Packaging IPA ==="
          
          APP_PATH="${{ steps.build_main.outputs.app_path }}"
          EXT_PATH="${{ steps.build_ext.outputs.ext_path }}"
          
          echo "App: $APP_PATH"
          echo "Ext: $EXT_PATH"
          
          PAYLOAD="build/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          
          # 复制 .app
          cp -R "$APP_PATH" "$PAYLOAD/"
          
          # 嵌入 extension（如果找到）
          if [ -n "$EXT_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH" .app)
            PLUGINS_DIR="$PAYLOAD/$APP_NAME/PlugIns"
            mkdir -p "$PLUGINS_DIR"
            cp -R "$EXT_PATH" "$PLUGINS_DIR/"
            echo "✅ Extension embedded"
          fi
          
          # 生成 IPA
          cd build
          zip -r ../JSKeyboard.ipa Payload -x "*.DS_Store"
          cd ..
          
          if [ -f JSKeyboard.ipa ]; then
            echo "✅ IPA created: $(du -sh JSKeyboard.ipa | cut -f1)"
            echo "ipa_path=$(pwd)/JSKeyboard.ipa" >> $GITHUB_OUTPUT
          else
            echo "❌ IPA not found"
            ls -la build/
            exit 1
          fi
      
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyboard
          path: JSKeyboard.ipa
          retention-days: 14
      
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          retention-days: 7
      
      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.package.conclusion }}" = "success" ]; then
            echo "✅ **IPA 构建成功！**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "下载artifact获取JSKeyboard.ipa" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **构建失败**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "请查看上方日志了解详情" >> $GITHUB_STEP_SUMMARY
          fi
