name: Build JSKeyboard IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          echo "=== Available schemes ==="
          xcodebuild -project JSKeyboard.xcodeproj -list 2>&1 || true
      
      - name: Build Main App
        id: build_app
        run: |
          set -e
          rm -rf build
          mkdir -p build
          
          echo "=== Building JSKeyboard ==="
          xcodebuild build \
            -project JSKeyboard.xcodeproj \
            -target JSKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            2>&1 | tee build/app.log
          
          APP=$(find . -name "JSKeyboard.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "app_path=$APP" >> $GITHUB_OUTPUT
            echo "✅ App built: $APP"
          else
            echo "❌ App not found"
            find . -name "*.app" -type d 2>/dev/null
            echo "app_path=" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Build Extension
        id: build_ext
        run: |
          set -e
          echo "=== Building JSKeyboardExtension ==="
          xcodebuild build \
            -project JSKeyboard.xcodeproj \
            -target JSKeyboardExtension \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jskeyboard.app.keyboard \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            VALID_ARCHS=arm64 \
            2>&1 | tee build/ext.log
          
          EXT=$(find . -name "JSKeyboardExtension.appex" -type d 2>/dev/null | head -1)
          if [ -n "$EXT" ]; then
            echo "ext_path=$EXT" >> $GITHUB_OUTPUT
            echo "✅ Extension built: $EXT"
          else
            echo "ext_path=" >> $GITHUB_OUTPUT
            echo "⚠️ Extension not found (will embed in app)"
          fi
      
      - name: Package IPA
        id: package
        run: |
          set -e
          APP="${{ steps.build_app.outputs.app_path }}"
          EXT="${{ steps.build_ext.outputs.ext_path }}"
          
          PAYLOAD="build/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/"
          
          if [ -n "$EXT" ]; then
            APP_NAME=$(basename "$APP" .app)
            mkdir -p "$PAYLOAD/$APP_NAME/PlugIns"
            cp -R "$EXT" "$PAYLOAD/$APP_NAME/PlugIns/"
          fi
          
          cd build
          zip -r ../JSKeyboard.ipa Payload -x "*.DS_Store"
          cd ..
          
          echo "✅ IPA created: $(du -sh JSKeyboard.ipa | cut -f1)"
          ls -la JSKeyboard.ipa
      
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyboard
          path: JSKeyboard.ipa
          retention-days: 14
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          retention-days: 7
      
      - name: Summary
        if: always()
        run: |
          echo "## 📱 JSKeyboard Build" >> $GITHUB_STEP_SUMMARY
          if [ -f "JSKeyboard.ipa" ]; then
            echo "✅ **IPA 构建成功！**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "请从 Actions → Artifacts 下载 JSKeyboard.ipa" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **构建失败**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "查看上方日志了解详情" >> $GITHUB_STEP_SUMMARY
          fi
